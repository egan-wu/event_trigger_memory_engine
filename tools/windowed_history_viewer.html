<!--
  Windowed history viewer — a standalone, dependency-free companion to
  ddrtiming's --windowed-csv output. Open this file directly in a browser
  (no server, no build step) and load any CSV produced by:
    ddrtiming_cli ... --windowed-csv history.csv
  or ddrt_write_report_json()'s "windows" array exported to CSV.

  Handles CSVs from different tool versions gracefully: columns are looked
  up by name from the header row, so an older CSV missing outstanding_*/
  bank_* columns just renders fewer panels instead of breaking. Handles both
  tiny (unit-test scale) and huge (many-thousand-window) traces by
  downsampling to a fixed number of display buckets when there are too many
  rows to render legibly -- see aggregateForDisplay().
-->
<title>Windowed History Viewer</title>

<div class="root">
  <h1>Windowed history viewer</h1>
  <p class="subtitle">Drop in a CSV from <code>--windowed-csv</code> (or a "windows" array exported to CSV) to see bandwidth, row-status, outstanding-occupancy, and bank-utilization history. Runs entirely in this page — nothing is uploaded anywhere.</p>

  <div class="load-row">
    <label class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" accept=".csv,text/csv" />
      <span>Drag a CSV here, or</span>
      <span class="btn">Choose file</span>
    </label>
  </div>
  <div id="status-line"></div>

  <div id="chart-wrap">
    <svg id="chart" viewBox="0 0 990 560" width="100%" style="display:block; overflow: visible;"></svg>
    <div id="tooltip"></div>
  </div>
</div>

const EXAMPLE_CSV = `window_index,start_ns,bytes_read,bytes_written,dram_bytes,txn_count,hits,conflicts,empties,avg_bandwidth_gbps,outstanding_high_water,outstanding_occupancy_pct,active_bank_count,bank_utilization_pct

const TARGET_BUCKETS = 150;

function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/);
  const header = lines[0].split(',').map(s => s.trim());
  const idx = {};
  header.forEach((name, i) => { idx[name] = i; });
  const rows = lines.slice(1).filter(l => l.length > 0).map(line => {
    const cells = line.split(',');
    const get = (name, def = 0) => (idx[name] !== undefined && cells[idx[name]] !== undefined && cells[idx[name]] !== '')
      ? parseFloat(cells[idx[name]]) : def;
    return {
      start_ns: get('start_ns'),
      bytes_read: get('bytes_read'),
      bytes_written: get('bytes_written'),
      txn_count: get('txn_count'),
      hits: get('hits'),
      conflicts: get('conflicts'),
      empties: get('empties'),
      outstanding_high_water: idx['outstanding_high_water'] !== undefined ? get('outstanding_high_water') : null,
      outstanding_occupancy_pct: idx['outstanding_occupancy_pct'] !== undefined ? get('outstanding_occupancy_pct') : null,
      active_bank_count: idx['active_bank_count'] !== undefined ? get('active_bank_count') : null,
      bank_utilization_pct: idx['bank_utilization_pct'] !== undefined ? get('bank_utilization_pct') : null,
    };
  });
  return rows;
}

// Downsample to <= TARGET_BUCKETS by summing additive fields and taking the
// max of "peak" fields (outstanding/bank) across each group of raw rows.
function aggregateForDisplay(rows) {
  if (rows.length <= TARGET_BUCKETS) return { buckets: rows, groupSize: 1 };
  const groupSize = Math.ceil(rows.length / TARGET_BUCKETS);
  const buckets = [];
  const windowNs = rows.length > 1 ? (rows[1].start_ns - rows[0].start_ns) : 1;
  for (let i = 0; i < rows.length; i += groupSize) {
    const group = rows.slice(i, i + groupSize);
    const b = { start_ns: group[0].start_ns, bytes_read: 0, bytes_written: 0, txn_count: 0, hits: 0, conflicts: 0, empties: 0,
                outstanding_high_water: null, outstanding_occupancy_pct: null, active_bank_count: null, bank_utilization_pct: null };
    let hasOutstanding = false, hasBank = false;
    for (const r of group) {
      b.bytes_read += r.bytes_read; b.bytes_written += r.bytes_written; b.txn_count += r.txn_count;
      b.hits += r.hits; b.conflicts += r.conflicts; b.empties += r.empties;
      if (r.outstanding_occupancy_pct !== null) { hasOutstanding = true; b.outstanding_occupancy_pct = Math.max(b.outstanding_occupancy_pct || 0, r.outstanding_occupancy_pct); b.outstanding_high_water = Math.max(b.outstanding_high_water || 0, r.outstanding_high_water); }
      if (r.bank_utilization_pct !== null) { hasBank = true; b.bank_utilization_pct = Math.max(b.bank_utilization_pct || 0, r.bank_utilization_pct); b.active_bank_count = Math.max(b.active_bank_count || 0, r.active_bank_count); }
    }
    if (!hasOutstanding) { b.outstanding_occupancy_pct = null; b.outstanding_high_water = null; }
    if (!hasBank) { b.bank_utilization_pct = null; b.active_bank_count = null; }
    b.duration_ns = windowNs * group.length;
    b.avg_bandwidth_gbps = b.duration_ns > 0 ? (b.bytes_read + b.bytes_written) / b.duration_ns : 0;
    buckets.push(b);
  }
  return { buckets, groupSize };
}

const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const svg = document.getElementById('chart');
const tooltip = document.getElementById('tooltip');
const wrap = document.getElementById('chart-wrap');
const statusLine = document.getElementById('status-line');

function render(rows, sourceLabel) {
  svg.innerHTML = '';
  if (rows.length === 0) {
    statusLine.textContent = 'No rows found in that file.';
    return;
  }
  for (const r of rows) if (r.outstanding_occupancy_pct === undefined) r.outstanding_occupancy_pct = null;
  const { buckets, groupSize } = aggregateForDisplay(rows.map(r => ({ ...r, avg_bandwidth_gbps: (r.bytes_read + r.bytes_written) })));
  // recompute avg_bandwidth_gbps properly when not downsampled (groupSize 1: duration = per-row window)
  const windowNs = rows.length > 1 ? (rows[1].start_ns - rows[0].start_ns) : (rows[0].duration_ns || 1);
  if (groupSize === 1) buckets.forEach((b, i) => { b.avg_bandwidth_gbps = windowNs > 0 ? (b.bytes_read + b.bytes_written) / windowNs : 0; b.duration_ns = windowNs; });

  statusLine.innerHTML = (sourceLabel === 'example' ? '<span class="example-tag">EXAMPLE DATA</span>' : '') +
    `${rows.length.toLocaleString()} window${rows.length===1?'':'s'} loaded` +
    (groupSize > 1 ? ` &rarr; downsampled to ${buckets.length} display buckets (${groupSize} raw windows/bucket)` : ' — shown at full resolution') +
    (sourceLabel === 'example' ? ' — load your own CSV to replace this.' : '');

  const hasOutstanding = buckets.some(b => b.outstanding_occupancy_pct !== null);
  const hasBank = buckets.some(b => b.bank_utilization_pct !== null);

  const marginL = 46, marginR = 16, plotW = 990 - marginL - marginR;
  const gap = 32;
  const bwH = 118, compH = 70, occH = hasOutstanding ? 62 : 0, bankH = hasBank ? 62 : 0;
  let y = 16;
  const bwTop = y; y += bwH; const axisY_bw = y; y += gap;
  const compTop = y; y += compH; const axisY_comp = y; y += gap;
  let occTop = 0, axisY_occ = 0, bankTop = 0, axisY_bank = 0;
  if (hasOutstanding) { occTop = y; y += occH; axisY_occ = y; y += gap; }
  if (hasBank) { bankTop = y; y += bankH; axisY_bank = y; y += gap; }
  const totalH = y + 20;
  svg.setAttribute('viewBox', `0 0 990 ${totalH}`);

  const n = buckets.length;
  const colW = plotW / n;
  const xAt = i => marginL + i * colW + colW / 2;

  // ---- panel 1: bandwidth ----
  const maxBw = Math.max(0.001, ...buckets.map(b => b.avg_bandwidth_gbps)) * 1.15;
  const yBw = v => bwTop + bwH - (v / maxBw) * bwH;
  svg.appendChild(el('text', { class: 'panel-label', x: marginL, y: bwTop - 4 })).textContent = 'Bandwidth (GB/s)';
  [0, 0.5, 1].forEach(f => {
    const yy = bwTop + bwH * (1 - f);
    svg.appendChild(el('line', { class: 'grid-line', x1: marginL, x2: marginL + plotW, y1: yy, y2: yy }));
    svg.appendChild(el('text', { class: 'axis-label', x: marginL - 6, y: yy + 3, 'text-anchor': 'end' })).textContent = (maxBw * f).toFixed(1);
  });
  let areaPath = `M ${xAt(0)} ${axisY_bw}`, linePath = `M ${xAt(0)} ${yBw(buckets[0].avg_bandwidth_gbps)}`;
  buckets.forEach((b, i) => { areaPath += ` L ${xAt(i)} ${yBw(b.avg_bandwidth_gbps)}`; if (i > 0) linePath += ` L ${xAt(i)} ${yBw(b.avg_bandwidth_gbps)}`; });
  areaPath += ` L ${xAt(n - 1)} ${axisY_bw} Z`;
  svg.appendChild(el('path', { class: 'area-fill', d: areaPath, fill: 'var(--series-1)' }));
  svg.appendChild(el('path', { class: 'line-mark', d: linePath, stroke: 'var(--series-1)' }));
  svg.appendChild(el('line', { class: 'axis-line', x1: marginL, x2: marginL + plotW, y1: axisY_bw, y2: axisY_bw }));

  // ---- panel 2: row-status stacked bars ----
  svg.appendChild(el('text', { class: 'panel-label', x: marginL, y: compTop - 4 })).textContent = 'Row status (transactions / window)';
  const maxCount = Math.max(1, ...buckets.map(b => b.hits + b.conflicts + b.empties)) * 1.12;
  [0, 0.5, 1].forEach(f => {
    const yy = compTop + compH * (1 - f);
    svg.appendChild(el('line', { class: 'grid-line', x1: marginL, x2: marginL + plotW, y1: yy, y2: yy }));
  });
  const barW = Math.max(1, colW - 1);
  buckets.forEach((b, i) => {
    const x = marginL + i * colW + (colW - barW) / 2;
    let yCursor = axisY_comp;
    const seg = (val, color) => {
      if (val <= 0) return;
      const h = (val / maxCount) * compH;
      svg.appendChild(el('rect', { x, y: yCursor - h, width: barW, height: h, fill: color }));
      yCursor -= h;
    };
    seg(b.hits, 'var(--series-1)'); seg(b.conflicts, 'var(--series-2)'); seg(b.empties, 'var(--series-3)');
  });
  svg.appendChild(el('line', { class: 'axis-line', x1: marginL, x2: marginL + plotW, y1: axisY_comp, y2: axisY_comp }));
  let lx = marginL + plotW - 190;
  [['Hit', 'var(--series-1)'], ['Conflict', 'var(--series-2)'], ['Empty', 'var(--series-3)']].forEach(([label, color]) => {
    svg.appendChild(el('rect', { x: lx, y: compTop - 12, width: 9, height: 9, fill: color, rx: 2 }));
    svg.appendChild(el('text', { class: 'legend-text', x: lx + 13, y: compTop - 4 })).textContent = label;
    lx += 12 + label.length * 6 + 16;
  });

  // ---- panel 3: outstanding occupancy (optional) ----
  if (hasOutstanding) {
    svg.appendChild(el('text', { class: 'panel-label', x: marginL, y: occTop - 4 })).textContent = 'Outstanding occupancy (% of cap)';
    [0, 50, 100].forEach(v => {
      const yy = occTop + occH * (1 - v / 100);
      svg.appendChild(el('line', { class: 'grid-line', x1: marginL, x2: marginL + plotW, y1: yy, y2: yy }));
      svg.appendChild(el('text', { class: 'axis-label', x: marginL - 6, y: yy + 3, 'text-anchor': 'end' })).textContent = v + '%';
    });
    let occLine = '';
    buckets.forEach((b, i) => {
      const v = b.outstanding_occupancy_pct || 0;
      const yy = occTop + occH * (1 - Math.min(100, v) / 100);
      occLine += (i === 0 ? 'M' : 'L') + ` ${xAt(i)} ${yy} `;
    });
    svg.appendChild(el('path', { class: 'line-mark', d: occLine, stroke: 'var(--series-4)' }));
    svg.appendChild(el('line', { class: 'axis-line', x1: marginL, x2: marginL + plotW, y1: axisY_occ, y2: axisY_occ }));
  }

  // ---- panel 4: bank utilization (optional) ----
  if (hasBank) {
    svg.appendChild(el('text', { class: 'panel-label', x: marginL, y: bankTop - 4 })).textContent = 'Bank utilization (% of banks active)';
    [0, 50, 100].forEach(v => {
      const yy = bankTop + bankH * (1 - v / 100);
      svg.appendChild(el('line', { class: 'grid-line', x1: marginL, x2: marginL + plotW, y1: yy, y2: yy }));
      svg.appendChild(el('text', { class: 'axis-label', x: marginL - 6, y: yy + 3, 'text-anchor': 'end' })).textContent = v + '%';
    });
    let bankLine = '';
    buckets.forEach((b, i) => {
      const v = b.bank_utilization_pct || 0;
      const yy = bankTop + bankH * (1 - Math.min(100, v) / 100);
      bankLine += (i === 0 ? 'M' : 'L') + ` ${xAt(i)} ${yy} `;
    });
    svg.appendChild(el('path', { class: 'line-mark', d: bankLine, stroke: 'var(--series-3)' }));
    svg.appendChild(el('line', { class: 'axis-line', x1: marginL, x2: marginL + plotW, y1: axisY_bank, y2: axisY_bank }));
  }

  // ---- x-axis ticks ----
  const bottomAxisY = hasBank ? axisY_bank : (hasOutstanding ? axisY_occ : axisY_comp);
  const tickIdx = [0, Math.floor(n * 0.25), Math.floor(n * 0.5), Math.floor(n * 0.75), n - 1];
  [...new Set(tickIdx)].forEach(i => {
    svg.appendChild(el('text', { class: 'axis-label', x: xAt(i), y: bottomAxisY + 14, 'text-anchor': 'middle' })).textContent = fmtNs(buckets[i].start_ns);
  });

  // ---- shared hover ----
  const hoverLine = el('line', { class: 'hover-x', x1: 0, x2: 0, y1: bwTop, y2: bottomAxisY });
  svg.appendChild(hoverLine);
  const dots = {
    bw: el('circle', { class: 'hover-dot', r: 4, stroke: 'var(--series-1)' }),
  };
  svg.appendChild(dots.bw);
  if (hasOutstanding) { dots.occ = el('circle', { class: 'hover-dot', r: 3.5, stroke: 'var(--series-4)' }); svg.appendChild(dots.occ); }
  if (hasBank) { dots.bank = el('circle', { class: 'hover-dot', r: 3.5, stroke: 'var(--series-3)' }); svg.appendChild(dots.bank); }

  const hitLayer = el('rect', { x: marginL, y: bwTop, width: plotW, height: bottomAxisY - bwTop, fill: 'transparent' });
  svg.appendChild(hitLayer);

  function showTooltip(i) {
    const b = buckets[i];
    hoverLine.setAttribute('x1', xAt(i)); hoverLine.setAttribute('x2', xAt(i)); hoverLine.style.opacity = 1;
    dots.bw.setAttribute('cx', xAt(i)); dots.bw.setAttribute('cy', yBw(b.avg_bandwidth_gbps)); dots.bw.style.opacity = 1;
    let rowsHtml = `<div class="tt-title">t = ${fmtNs(b.start_ns)}</div>` +
      `<div class="tt-row"><span>Bandwidth</span><b>${b.avg_bandwidth_gbps.toFixed(2)} GB/s</b></div>` +
      `<div class="tt-row"><span>Bytes (R/W)</span><b>${Math.round(b.bytes_read).toLocaleString()} / ${Math.round(b.bytes_written).toLocaleString()}</b></div>` +
      `<div class="tt-row"><span>Hit/Conflict/Empty</span><b>${Math.round(b.hits)}/${Math.round(b.conflicts)}/${Math.round(b.empties)}</b></div>`;
    if (hasOutstanding && b.outstanding_occupancy_pct !== null) {
      const yy = occTop + occH * (1 - Math.min(100, b.outstanding_occupancy_pct) / 100);
      dots.occ.setAttribute('cx', xAt(i)); dots.occ.setAttribute('cy', yy); dots.occ.style.opacity = 1;
      rowsHtml += `<div class="tt-row"><span>Outstanding</span><b>${b.outstanding_occupancy_pct.toFixed(0)}% (${Math.round(b.outstanding_high_water)})</b></div>`;
    }
    if (hasBank && b.bank_utilization_pct !== null) {
      const yy = bankTop + bankH * (1 - Math.min(100, b.bank_utilization_pct) / 100);
      dots.bank.setAttribute('cx', xAt(i)); dots.bank.setAttribute('cy', yy); dots.bank.style.opacity = 1;
      rowsHtml += `<div class="tt-row"><span>Active banks</span><b>${b.bank_utilization_pct.toFixed(0)}% (${Math.round(b.active_bank_count)})</b></div>`;
    }
    tooltip.innerHTML = rowsHtml;
    const wrapRect = wrap.getBoundingClientRect();
    const scale = wrapRect.width / 990;
    let left = xAt(i) * scale + 14;
    if (left + 210 > wrapRect.width) left = xAt(i) * scale - 210;
    tooltip.style.left = left + 'px';
    tooltip.style.top = (bwTop * scale) + 'px';
    tooltip.style.opacity = 1;
  }
  function hideTooltip() {
    hoverLine.style.opacity = 0;
    Object.values(dots).forEach(d => d.style.opacity = 0);
    tooltip.style.opacity = 0;
  }
  hitLayer.addEventListener('mousemove', (ev) => {
    const rect = svg.getBoundingClientRect();
    const scale = 990 / rect.width;
    const svgX = (ev.clientX - rect.left) * scale;
    let i = Math.round((svgX - marginL - colW / 2) / colW);
    i = Math.max(0, Math.min(n - 1, i));
    showTooltip(i);
  });
  hitLayer.addEventListener('mouseleave', hideTooltip);
}

function fmtNs(ns) {
  if (ns >= 1e6) return (ns / 1e6).toFixed(ns >= 1e7 ? 0 : 1) + ' ms';
  if (ns >= 1e3) return (ns / 1e3).toFixed(1) + ' µs';
  return Math.round(ns) + ' ns';
}

function loadCsvText(text, label) {
  try {
    const rows = parseCsv(text);
    render(rows, label);
  } catch (e) {
    statusLine.textContent = 'Could not parse that CSV: ' + e.message;
  }
}

const fileInput = document.getElementById('file-input');
const dropZone = document.getElementById('drop-zone');
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => loadCsvText(reader.result, 'user');
  reader.readAsText(file);
});
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => loadCsvText(reader.result, 'user');
  reader.readAsText(file);
});

loadCsvText(EXAMPLE_CSV, 'example');
</script>
